name: MCP CLI Release

on:
  push:
    branches:
      - main
    paths:
      - "src/cli/**"
      - "src/plutoManagerTypes.ts"
      - "src/plutoManager.ts"
      - "src/mcp-server-http.ts"
      - "src/notebookOutput.ts"
      - "src/platformUtils.ts"
      - "src/portUtils.ts"
      - "packages/advanced-pluto-mcp/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode"
        required: false
        type: boolean
        default: false

concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  mcp-ci:
    name: Run MCP CI
    uses: ./.github/workflows/mcp-ci.yml

  mcp-release:
    name: MCP Semantic Release
    runs-on: ubuntu-latest
    needs: mcp-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI production bundle
        run: npm run build:production --workspace=packages/advanced-pluto-mcp

      # The extension release may push its version-bump commits to main
      # while this job runs; semantic-release refuses to publish from a
      # branch that is behind its remote
      - name: Sync with the tip of main
        run: |
          git fetch origin main
          git reset --hard origin/main

      # Run from the package directory so its .releaserc.json is the only
      # config semantic-release loads (the repository's own config would
      # otherwise be merged in, plugins included)
      - name: Run semantic-release for MCP CLI
        working-directory: packages/advanced-pluto-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
